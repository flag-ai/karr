# Local stack: PostgreSQL, KARR, and optional Prometheus + Grafana for the
# dashboard in grafana/. Production runs from the kitt-stack compose in the
# infrastructure repo; this file is for development only.
#
#   cp .env.example .env   # then fill KARR_ADMIN_TOKEN and KARR_SECRET_KEY
#   docker compose up -d postgres karr
#   docker compose --profile observability up -d   # adds Prometheus + Grafana
services:
  postgres:
    image: postgres:17.6-alpine
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-karr}
      POSTGRES_USER: ${POSTGRES_USER:-karr}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "127.0.0.1:5432:5432"
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-karr} -d ${POSTGRES_DB:-karr}"]
      interval: 5s
      timeout: 5s
      retries: 5

  karr:
    build:
      context: .
      args:
        VERSION: dev
        COMMIT: local
        BUILD_DATE: "1970-01-01"
    ports:
      - "127.0.0.1:8080:8080"
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-karr}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB:-karr}
      KARR_ADMIN_TOKEN: ${KARR_ADMIN_TOKEN:?Set KARR_ADMIN_TOKEN in .env}
      KARR_SECRET_KEY: ${KARR_SECRET_KEY:?Set KARR_SECRET_KEY in .env}
      KARR_PUBLIC_URL: ${KARR_PUBLIC_URL:-http://localhost:8080}
      KARR_ALLOW_INSECURE_INSTALL: ${KARR_ALLOW_INSECURE_INSTALL:-true}
      KARR_DEFAULT_AGENT_URL: ${KARR_DEFAULT_AGENT_URL:-}
      KARR_DEFAULT_AGENT_TOKEN: ${KARR_DEFAULT_AGENT_TOKEN:-}
      KARR_CORS_ORIGINS: ${KARR_CORS_ORIGINS:-}
      LOG_LEVEL: ${LOG_LEVEL:-info}
      LOG_FORMAT: ${LOG_FORMAT:-text}
    depends_on:
      postgres:
        condition: service_healthy

  prometheus:
    image: prom/prometheus:v3.5.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:9090:9090"
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
    depends_on:
      - karr

  grafana:
    image: grafana/grafana:12.1.0
    profiles: ["observability"]
    ports:
      - "127.0.0.1:3000:3000"
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GF_ADMIN_PASSWORD:?Set GF_ADMIN_PASSWORD in .env}
      GF_USERS_DEFAULT_THEME: dark
    volumes:
      - ./grafana/provisioning/datasources:/etc/grafana/provisioning/datasources:ro
      - ./grafana/provisioning/dashboards:/etc/grafana/provisioning/dashboards:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
    depends_on:
      - prometheus

volumes:
  pgdata:
